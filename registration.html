<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://db.onlinewebfonts.com/c/97c4b25dc74e0ab045154e75a8fdd69d?family=Game+of+Thrones" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
    <title>MOS2K24</title>
    
</head>
<body>

    <nav id="navbar">
        <a href="#" id="logo">
            <img src="img/logo.png" alt="Logo" style="max-height: 50px;">
        </a>
        <div id="menu-toggle">&#9776;</div> <div id="nav-links">
            <a href="index.html">Home</a>
            <a href="registration.html">Registration</a>
            <a href="OCTEAM.HTML">OC Team</a>
            <a href="#">Memories</a>
        </div>
        <div id="mobile-menu">
            <a href="index.html">Home</a>
            <a href="registration.html">Registration</a>
            <a href="OCTEAM.HTML">OC Team</a>
            <a href="#">Memories</a>
        </div>
    </nav>
    <main>
    <div id="form-container">
        <form id="registration-form">
            <div class="mb-3">
                <label for="name" style="color: #b08d2a;" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter your Phone Number">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="emergencyPhone" class="form-label">Emergency Phone Number</label>
                <input type="text" class="form-control" id="emergencyPhone" name="emergencyPhone" placeholder="Enter your Emergency Phone Number">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="subject" class="form-label">Department</label>
                <div class="custom-select">
                    <div class="select-button" id="selectButton">Select</div>
                    <div class="select-options" id="selectOptions">
                        <div class="option" data-value="IGV">IGV</div>
                        <div class="option" data-value="OGV">OGV</div>
                        <div class="option" data-value="IGT">IGT</div>
                        <div class="option" data-value="OGT">OGT</div>
                        <div class="option" data-value="MKT&IM">MKT&IM</div>
                        <div class="option" data-value="BD&EWA">BD&EWA</div>
                        <div class="option" data-value="TM">TM</div>
                    </div>
                    <input type="hidden" id="selectedValue" name="department" value="">
                </div>
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="allergy" class="form-label">Allergy</label>
                <input type="text" class="form-control" id="allergy" name="allergy" placeholder="Enter your Allergy">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="ocExpectation" class="form-label">OC Expectation</label>
                <input type="text" class="form-control" id="ocExpectation" name="ocExpectation" placeholder="Enter OC Expectation">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="faciExpectation" class="form-label">FACI Expectation</label>
                <input type="text" class="form-control" id="faciExpectation" name="faciExpectation" placeholder="Enter FACI Expectation">
            </div>
            <div class="mb-3">
                <label style="color: #b08d2a;" for="chairExpectation" class="form-label">Chair Expectation</label>
                <input type="text" class="form-control" id="chairExpectation" name="chairExpectation" placeholder="Enter Chair Expectation">
            </div>
            
            <div class="mb-3">
                <label style="color: #b08d2a;" for="freeSpace" class="form-label">Free Space</label>
                <textarea class="form-control" id="freeSpace" name="freeSpace" rows="5" placeholder="Enter your message"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" name="terms">
                <label style="color: white;" class="form-check-label" for="terms">I agree to the <a href="_Indemnity Form MOS 2k24.pdf" style="color:rgb(212, 175, 55); text-decoration: none;" target="_blank">Terms of Use</a></label>
            </div>
            <label style="color: #b08d2a;" for="signature" class="form-label">Signature</label>
            <div id="signature-box">
                <canvas id="signature-pad" width="400" height="200"></canvas>
                <button id="clear-btn">Clear</button>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
        
    </div>
</main>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        menuToggle.addEventListener('click', () => {
            mobileMenu.style.display = mobileMenu.style.display === 'block' ? 'none' : 'block';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const selectButton = document.getElementById('selectButton');
        const selectOptions = document.getElementById('selectOptions');
        const selectedValue = document.getElementById('selectedValue');
        const options = selectOptions.querySelectorAll('.option');

        selectButton.addEventListener('click', () => {
            selectOptions.classList.toggle('show');
        });

        options.forEach(option => {
            option.addEventListener('click', () => {
                selectButton.textContent = option.textContent;
                selectedValue.value = option.dataset.value;
                selectOptions.classList.remove('show');
            });
        });
        document.addEventListener('click', (event) => {
          if (!selectButton.contains(event.target) && !selectOptions.contains(event.target)) {
            selectOptions.classList.remove('show');
          }
        });
    </script>
    <script>
        const canvas = document.getElementById('signature-pad');
        const context = canvas.getContext('2d');
        let drawing = false;
    
        // Set initial drawing properties
        context.lineWidth = 3;
        context.lineCap = 'round';
        context.strokeStyle = '#D4AF37'; // Gold color for signature
    
        // Start drawing
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            context.beginPath();
            context.moveTo(e.offsetX, e.offsetY);
        });
    
        // Draw on canvas
        canvas.addEventListener('mousemove', (e) => {
            if (drawing) {
                context.lineTo(e.offsetX, e.offsetY);
                context.stroke();
            }
        });
    
        // Stop drawing
        canvas.addEventListener('mouseup', () => {
            drawing = false;
        });
    
        // Clear the canvas
        document.getElementById('clear-btn').addEventListener('click', () => {
            context.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
    <script>
        const form = document.querySelector('registration-form');
        
        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent the form from submitting normally
            
            const formData = new FormData(form);
            
            // Convert form data into an object
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                emergencyPhone: formData.get('emergencyPhone'),
                department: formData.get('department'),
                allergy: formData.get('allergy'),
                ocExpectation: formData.get('ocExpectation'),
                faciExpectation: formData.get('faciExpectation'),
                chairExpectation: formData.get('chairExpectation'),
                freeSpace: formData.get('freeSpace'),
                signature: document.getElementById('signature-pad').toDataURL() // Get the signature as a base64 string
            };
            
            // Send the data to Google Apps Script using Fetch API
            fetch('YOUR_GOOGLE_APPS_SCRIPT_URL', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.text())
            .then(result => {
                alert('Form Submitted Successfully!');
                form.reset();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was an error submitting the form!');
            });
        });
    </script>
</body>
</html>
